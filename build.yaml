# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Standalone mode (2 devices): Left peripheral + Right central
  - board: nice_nano_v2
    shield: charybdis_left
    artifact-name: charybdis_left_standalone
  - board: nice_nano_v2
    shield: charybdis_right
    artifact-name: charybdis_right_standalone
  
  # Dongle mode (3 devices): Left peripheral + Right peripheral + Dongle central
  - board: nice_nano_v2
    shield: charybdis_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: charybdis_left_dongle
  - board: nice_nano_v2
    shield: charybdis_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: charybdis_right_dongle
  - board: nice_nano_v2
    shield: charybdis_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: charybdis_central_dongle_oled
  
  # Utility
  - board: nice_nano_v2
    shield: settings_reset
